apiVersion: v1
kind: ConfigMap
metadata:
  name: httpd-html-content
  namespace: httpd-app
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Custom OpenShift Web App</title>
      <style>
        body { font-family: sans-serif; display: grid; place-content: center; height: 90vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #ee0000; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Hello from OpenShift GitOps!</h1>
        <p>This content is managed entirely via a Kubernetes ConfigMap.</p>
      </div>
    </body>
    </html>
